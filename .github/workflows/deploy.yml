name: Deploy

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/moemadeldin/applyai:latest

      - name: Copy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml,docker/nginx/default.conf"
          target: "/home/ubuntu/applyai"
          strip_components: 0

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/applyai

            mkdir -p storage/app docker/nginx

            docker compose down

            docker compose pull app queue redis

            cat > .env << 'ENVEOF'
            APP_KEY=${{ secrets.APP_KEY }}
            APP_ENV=production
            APP_DEBUG=false
            APP_URL=http://${{ secrets.EC2_HOST }}
            DB_CONNECTION=pgsql
            DB_HOST=postgres
            DB_PORT=5432
            DB_DATABASE=applyai
            DB_USERNAME=applyai
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            FILESYSTEM_DISK=s3
            REDIS_HOST=redis
            QUEUE_CONNECTION=redis
            CACHE_STORE=redis
            SESSION_DRIVER=redis
            SESSION_LIFETIME=120
            AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            AWS_DEFAULT_REGION=${{ secrets.AWS_DEFAULT_REGION }}
            AWS_BUCKET=${{ secrets.AWS_BUCKET }}
            AWS_USE_PATH_STYLE_ENDPOINT=false
            SENTRY_LARAVEL_DSN=${{ secrets.SENTRY_LARAVEL_DSN }}
            GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
            GROQ_API_CHAT=${{ secrets.GROQ_API_CHAT }}
            AI_MODEL=${{ secrets.AI_MODEL }}
            MAIL_MAILER=smtp
            MAIL_HOST=smtp.gmail.com
            MAIL_PORT=587
            MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
            MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
            MAIL_FROM_ADDRESS=${{ secrets.MAIL_USERNAME }}
            MAIL_FROM_NAME=ApplyAI
            FRONTEND_URL=https://apply-ai-ui.vercel.app/
            TURNSTILE_SITE_KEY=${{ secrets.TURNSTILE_SITE_KEY }}
            TURNSTILE_SECRET_KEY=${{ secrets.TURNSTILE_SECRET_KEY }}
            ENVEOF

            docker compose up -d

            docker system prune -af
