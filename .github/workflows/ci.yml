name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
      GEMINI_MODELS: ${{ secrets.GEMINI_MODELS }}
      GEMINI_REQUEST_TIMEOUT: ${{ secrets.GEMINI_REQUEST_TIMEOUT }}
      OPENROUTER_ENABLED: ${{ secrets.OPENROUTER_ENABLED }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_BASE_URL: ${{ secrets.OPENROUTER_BASE_URL }}
      OPENROUTER_MODELS: ${{ secrets.OPENROUTER_MODELS }}
      OPENROUTER_REQUEST_TIMEOUT: ${{ secrets.OPENROUTER_REQUEST_TIMEOUT }}
      DEEPSEEK_ENABLED: ${{ secrets.DEEPSEEK_ENABLED }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
      DEEPSEEK_MODELS: ${{ secrets.DEEPSEEK_MODELS }}
      DEEPSEEK_REQUEST_TIMEOUT: ${{ secrets.DEEPSEEK_REQUEST_TIMEOUT }}
      JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
      JINA_READER_URL: ${{ secrets.JINA_READER_URL }}
      TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      AWS_BUCKET: ${{ secrets.AWS_BUCKET }}
      SENTRY_LARAVEL_DSN: ${{ secrets.SENTRY_LARAVEL_DSN }}
      APP_KEY: ${{ secrets.APP_KEY }}

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: applyai
          POSTGRES_USER: applyai
          POSTGRES_PASSWORD: applyai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          extensions: pdo, pdo_pgsql, pgsql, zip
          tools: composer:v2

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite

      - name: Run PHPStan
        run: composer test:types

      - name: Run Pest
        run: php artisan test
        env:
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: applyai
          DB_USERNAME: applyai
          DB_PASSWORD: applyai_test
          FILESYSTEM_DISK: local
